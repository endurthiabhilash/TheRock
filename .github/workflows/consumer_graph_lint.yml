# Verifies that the committed consumer graph (test_tools/therock_consumer_graph.json)
# stays in sync with the dependency edges declared in the CMakeLists.txt files.
#
# The graph is emitted at CMake configure time by therock_emit_consumer_graph().
# It is committed so the CI change-detection job can read it without configuring.
# This job regenerates it and fails if the committed copy is stale, telling the
# contributor to run `--regenerate` and re-commit.
#
# Runs only when files that can change the graph are touched.

name: consumer-graph-lint

on:
  pull_request:
    paths:
      - "**/CMakeLists.txt"
      - "cmake/therock_subproject.cmake"
      - "cmake/therock_emit_consumer_graph.cmake"
      - "test_tools/therock_consumer_graph.json"
      - ".github/workflows/consumer_graph_lint.yml"
  push:
    branches: [main]
    paths:
      - "**/CMakeLists.txt"
      - "cmake/therock_subproject.cmake"
      - "cmake/therock_emit_consumer_graph.cmake"
      - "test_tools/therock_consumer_graph.json"

permissions:
  contents: read

jobs:
  consumer-graph-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Fetch sources
        # The consumer graph is populated by every therock_cmake_subproject_declare()
        # call, so all subproject source trees must be present for a complete graph.
        run: python3 ./build_tools/fetch_sources.py --jobs 12 --depth 1

      - name: Configure (emits the consumer graph)
        # Configure only, no build. THEROCK_ENABLE_ALL=ON ensures every subproject
        # is declared so the emitted graph matches the committed full-tree copy.
        run: |
          cmake -B build -S . -GNinja \
            -DTHEROCK_ENABLE_ALL=ON \
            -DTHEROCK_AMDGPU_FAMILIES=gfx110X-all

      - name: Check committed consumer graph is up to date
        run: |
          python3 ./test_tools/determine_rocm_test_dependencies.py --regenerate
          if ! git diff --exit-code -- test_tools/therock_consumer_graph.json; then
            echo "::error::test_tools/therock_consumer_graph.json is stale."
            echo "A dependency edge changed but the committed consumer graph was not regenerated."
            echo "Fix: run a cmake configure, then:"
            echo "    python3 ./test_tools/determine_rocm_test_dependencies.py --regenerate"
            echo "and commit test_tools/therock_consumer_graph.json."
            exit 1
          fi
